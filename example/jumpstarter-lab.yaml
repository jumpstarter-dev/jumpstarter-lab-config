# This is a basic configuration for the jumpstarter-lab-config tool
# It defines the sources for locations, clients, exporter hosts, exporters,
# exporter templates, access policies, and jumpstarter controllers.

sources:
  locations:
    - locations/*.yaml
  exporter_hosts:
    - devices/*/*/*-sidekick.yaml
  exporters:
    - devices/*/*/*-dut.yaml
  exporter_templates:
    - exporter-templates/*/*.yaml
  jumpstarter_instances:
    - jumpstarter-instances/*.yaml

# Keys match JumpstarterInstance metadata.name, not filenames.
# Without global sources, omitted resource types are not synchronized or pruned.
instances:
  jump1-mpp-bos:
    clients:
      sources:
        - clients/*.yaml
    policies:
      sources:
        - policies/*.yaml
  jump1-mpp-stagging-bos:
    clients:
      # Sources enable sync; paths are relative to this file.
      sources:
        - clients/majopela.yaml
    policies:
      sources:
        - policies/devs.yaml
  jump-centos:
    # Omitted clients are left alone, e.g. when provisioned through OIDC.
    policies:
      sources:
        - policies/ci-instances.yaml
      # To select no policies, use sources: [] instead of the list above.
      # This enables sync; --prune would delete all policies in this namespace.

variables:
  - vars.yaml
